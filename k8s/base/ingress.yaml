# ALB creado por el AWS Load Balancer Controller.
#   /api/* -> backend
#   /*     -> frontend
#
# El SG del ALB lo crea OpenTofu (output alb_security_group_id) y lo completa
# el overlay. Así la allowlist (allowed_cidrs) la maneja OpenTofu y el SG no
# queda huérfano.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facturacion
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Nombre fijo: el down lo usa para esperar a que el ALB desaparezca.
    alb.ingress.kubernetes.io/load-balancer-name: facturacion
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/security-groups: REEMPLAZADO-POR-OVERLAY
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: facturacion-back
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: facturacion-web
                port:
                  name: http
