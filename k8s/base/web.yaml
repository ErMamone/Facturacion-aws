# Frontend React servido por nginx-unprivileged (repo Facturacion-web).
# No hace proxy de /api: el ALB rutea /api al backend (mismo origen, sin CORS).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facturacion-web
  labels:
    app: facturacion-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facturacion-web
  template:
    metadata:
      labels:
        app: facturacion-web
    spec:
      securityContext:
        runAsNonRoot: true
        # Usuario "nginx" de la imagen nginx-unprivileged
        runAsUser: 101
      containers:
        - name: web
          image: facturacion-web
          ports:
            - name: http
              containerPort: 8080
          # Fargate: 0,25 vCPU / 0,5 GB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: facturacion-web
spec:
  selector:
    app: facturacion-web
  ports:
    - name: http
      port: 80
      targetPort: http
