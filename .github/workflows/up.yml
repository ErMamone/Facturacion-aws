# Levanta el entorno completo y despliega la app (doc 07).
# Corre en el environment `demo` (pide tu aprobación). Tarda ~25 min.
name: up

on:
  workflow_dispatch:
    inputs:
      ttl_hours:
        description: Horas hasta que auto-destroy baje todo (1-12)
        type: number
        default: 3
      allowed_cidrs:
        description: CIDRs que pueden entrar al ALB, separados por coma (ej. 203.0.113.10/32)
        type: string
        default: "0.0.0.0/0"
      retention:
        description: Vida de cada factura (APP_RETENTION, ISO-8601)
        type: string
        default: PT10M
      back_tag:
        description: Tag de la imagen facturacion-back en ECR
        type: string
        default: latest
      web_tag:
        description: Tag de la imagen facturacion-web en ECR
        type: string
        default: latest

permissions: {}

# up, down y auto-destroy nunca corren a la vez.
concurrency:
  group: env-demo
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TOFU_VERSION: "1.13.1"
  KUBECTL_VERSION: v1.37.1
  CLUSTER: facturacion
  NAMESPACE: facturacion

jobs:
  up:
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar inputs
        id: inputs
        env:
          TTL_HOURS: ${{ inputs.ttl_hours }}
          ALLOWED_CIDRS: ${{ inputs.allowed_cidrs }}
        run: |
          set -euo pipefail
          if ! [[ "$TTL_HOURS" =~ ^[0-9]+$ ]] || (( TTL_HOURS < 1 || TTL_HOURS > 12 )); then
            echo "::error::ttl_hours tiene que ser un entero entre 1 y 12"; exit 1
          fi
          cidrs=$(jq -cRn --arg s "$ALLOWED_CIDRS" '$s | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "$cidrs" | jq -e 'length > 0 and all(test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$"))' >/dev/null \
            || { echo "::error::allowed_cidrs inválido: $ALLOWED_CIDRS"; exit 1; }
          echo "cidrs=$cidrs" >> "$GITHUB_OUTPUT"
          echo "expires_at=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-aws
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}
          kubectl-version: ${{ env.KUBECTL_VERSION }}

      # Antes de gastar plata: las imágenes tienen que existir en ECR.
      - name: Verificar imágenes en ECR
        id: ecr
        env:
          BACK_TAG: ${{ inputs.back_tag }}
          WEB_TAG: ${{ inputs.web_tag }}
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name facturacion-back --image-ids imageTag="$BACK_TAG" >/dev/null \
            || { echo "::error::No existe facturacion-back:$BACK_TAG en ECR"; exit 1; }
          aws ecr describe-images --repository-name facturacion-web --image-ids imageTag="$WEB_TAG" >/dev/null \
            || { echo "::error::No existe facturacion-web:$WEB_TAG en ECR"; exit 1; }
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$account" >> "$GITHUB_OUTPUT"
          echo "registry=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: tofu apply
        working-directory: infra/env
        env:
          TF_VAR_allowed_cidrs: ${{ steps.inputs.outputs.cidrs }}
          TF_VAR_expires_at: ${{ steps.inputs.outputs.expires_at }}
          # Opcional: tu usuario IAM, para usar kubectl desde tu máquina.
          # Variable de GitHub en formato JSON: ["arn:aws:iam::<account>:user/<usuario>"]
          TF_VAR_admin_principal_arns: ${{ vars.CLUSTER_ADMIN_ARNS || '[]' }}
          STATE_BUCKET: facturacion-tfstate-${{ steps.ecr.outputs.account }}
        run: |
          set -euo pipefail
          tofu init -input=false -backend-config="bucket=${STATE_BUCKET}"
          tofu apply -input=false -auto-approve
          tofu output -json > "$RUNNER_TEMP/outputs.json"

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Secret de la base
        run: |
          set -euo pipefail
          secret_arn=$(jq -r '.rds_master_secret_arn.value' "$RUNNER_TEMP/outputs.json")
          secret=$(aws secretsmanager get-secret-value --secret-id "$secret_arn" --query SecretString --output text)
          username=$(jq -r .username <<<"$secret")
          password=$(jq -r .password <<<"$secret")
          echo "::add-mask::$password"
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create secret generic facturacion-db -n "$NAMESPACE" \
            --from-literal=username="$username" \
            --from-literal=password="$password" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACK_TAG: ${{ inputs.back_tag }}
          WEB_TAG: ${{ inputs.web_tag }}
          APP_RETENTION: ${{ inputs.retention }}
        run: |
          set -euo pipefail
          scripts/render-k8s.sh "$RUNNER_TEMP/outputs.json"
          kubectl apply -k k8s/overlays/demo
          kubectl rollout status deployment/facturacion-back -n "$NAMESPACE" --timeout=15m
          kubectl rollout status deployment/facturacion-web -n "$NAMESPACE" --timeout=10m

      - name: Esperar ALB
        id: alb
        run: |
          set -euo pipefail
          host=""
          for _ in $(seq 1 60); do
            host=$(kubectl get ingress facturacion -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [[ -n "$host" ]] && break
            sleep 10
          done
          [[ -n "$host" ]] || { echo "::error::El Ingress no tiene ALB después de 10 minutos"; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
          # El DNS del ALB tarda unos minutos en resolver y los targets en pasar a healthy.
          # /api sin filtros devuelve 400 del backend: cualquier código < 500 significa
          # que el ALB llegó al pod (502/503 = sin targets sanos; 000 = sin DNS/conexión).
          code() { curl -s -o /dev/null --max-time 5 -w '%{http_code}' "$1" || true; }
          for _ in $(seq 1 60); do
            web=$(code "http://$host/")
            api=$(code "http://$host/api/facturas")
            echo "web=$web api=$api"
            if [[ "$web" == "200" && "$api" != "000" && "$api" -lt 500 ]]; then
              echo "ALB respondiendo"; exit 0
            fi
            sleep 10
          done
          echo "::error::El ALB no responde después de 10 minutos"; exit 1

      - name: Resumen
        if: always()
        env:
          HOST: ${{ steps.alb.outputs.host }}
          EXPIRES_AT: ${{ steps.inputs.outputs.expires_at }}
          ALLOWED_CIDRS: ${{ inputs.allowed_cidrs }}
          BACK_TAG: ${{ inputs.back_tag }}
          WEB_TAG: ${{ inputs.web_tag }}
        run: |
          local_time=$(TZ=America/Argentina/Buenos_Aires date -d "$EXPIRES_AT" '+%d/%m %H:%M' 2>/dev/null || echo "?")
          {
            echo "## Entorno demo"
            echo
            if [[ -n "$HOST" ]]; then
              echo "**URL:** http://$HOST"
            else
              echo "**El up no terminó bien.** Lo que se haya creado lo baja auto-destroy, o corré \`down\` a mano."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Auto-destroy | $EXPIRES_AT ($local_time hora Argentina) |"
            echo "| Acceso | \`$ALLOWED_CIDRS\` |"
            echo "| Imágenes | back \`$BACK_TAG\`, web \`$WEB_TAG\` |"
            echo
            echo "Para extender el tiempo, volvé a correr \`up\` con otro \`ttl_hours\`."
          } >> "$GITHUB_STEP_SUMMARY"
